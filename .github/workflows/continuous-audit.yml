name: Continuous Audit

on:
  # Ejecución semanal: Domingos a las 3:00 AM (hora de México)
  schedule:
    - cron: '0 9 * * 0'  # 09:00 UTC = 03:00 CST (Mexico City)
  
  # Ejecución manual desde GitHub UI
  workflow_dispatch:
    inputs:
      skip_cache:
        description: 'Skip cache and force fresh install'
        required: false
        type: boolean
        default: false
  
  # Ejecución en Pull Requests a main y dev/*
  pull_request:
    branches:
      - main
      - 'dev/**'
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/**'
      - '!.github/workflows/continuous-audit.yml'

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  audit:
    name: Run Continuous Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      
      - name: 🔧 Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tree curl netcat-openbsd
      
      - name: 🐍 Install Python Dependencies
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || echo "Some dependencies failed to install"
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt || echo "Some dev dependencies failed to install"
          fi
      
      - name: 📦 Install Web Dependencies
        continue-on-error: true
        working-directory: web
        run: |
          if [ -f package.json ]; then
            npm ci || npm install || echo "NPM install failed"
          fi
      
      - name: 📊 Generate Timestamp
        id: timestamp
        run: |
          STAMP=$(date +"%Y%m%d-%H%M%S")
          echo "stamp=$STAMP" >> $GITHUB_OUTPUT
          echo "Audit timestamp: $STAMP"
      
      - name: 🔍 Run Audit Script
        id: audit
        continue-on-error: true
        run: |
          bash audits/run_local_audit.sh
          echo "audit_exit_code=$?" >> $GITHUB_OUTPUT
      
      - name: 📋 Find Latest Audit Directory
        id: find_audit
        run: |
          LATEST_AUDIT=$(ls -td audits/history/*/ 2>/dev/null | head -1 | sed 's:/$::')
          if [ -z "$LATEST_AUDIT" ]; then
            echo "No audit directory found!"
            exit 1
          fi
          echo "audit_dir=$LATEST_AUDIT" >> $GITHUB_OUTPUT
          echo "Latest audit: $LATEST_AUDIT"
      
      - name: 📝 Generate CI Summary
        if: always()
        run: |
          python audits/ci/report_merge.py "${{ steps.find_audit.outputs.audit_dir }}" >> $GITHUB_STEP_SUMMARY
      
      - name: 📤 Upload Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ steps.timestamp.outputs.stamp }}
          path: ${{ steps.find_audit.outputs.audit_dir }}/
          retention-days: 30
          if-no-files-found: warn
      
      - name: 📤 Upload Logs Separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-logs-${{ steps.timestamp.outputs.stamp }}
          path: ${{ steps.find_audit.outputs.audit_dir }}/logs/
          retention-days: 30
          if-no-files-found: warn
      
      - name: 💬 Comment on PR (if applicable)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const auditDir = '${{ steps.find_audit.outputs.audit_dir }}';
            const summaryPath = `${auditDir}/SUMMARY.md`;
            
            let comment = '## 📊 Continuous Audit Report\n\n';
            
            if (fs.existsSync(summaryPath)) {
              const summary = fs.readFileSync(summaryPath, 'utf8');
              
              // Extract key stats
              const passedMatch = summary.match(/Passed.*?(\d+)/);
              const failedMatch = summary.match(/Failed.*?(\d+)/);
              const skippedMatch = summary.match(/Skipped.*?(\d+)/);
              
              const passed = passedMatch ? passedMatch[1] : '0';
              const failed = failedMatch ? failedMatch[1] : '0';
              const skipped = skippedMatch ? skippedMatch[1] : '0';
              
              comment += `**Results:**\n`;
              comment += `- ✅ Passed: ${passed}\n`;
              comment += `- ❌ Failed: ${failed}\n`;
              comment += `- ⏭️ Skipped: ${skipped}\n\n`;
              
              if (failed > 0) {
                comment += `⚠️ **Some checks failed!** Review the artifacts for details.\n\n`;
              } else {
                comment += `✨ **All checks passed!**\n\n`;
              }
              
              comment += `📦 [Download Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
            } else {
              comment += '❌ Audit summary not found. Check workflow logs.\n';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: ✅ Check Final Status
        if: always()
        run: |
          if [ -f "${{ steps.find_audit.outputs.audit_dir }}/SUMMARY.md" ]; then
            if grep -q "AUDIT FAILED" "${{ steps.find_audit.outputs.audit_dir }}/SUMMARY.md"; then
              echo "❌ Audit failed!"
              exit 1
            elif grep -q "AUDIT PASSED" "${{ steps.find_audit.outputs.audit_dir }}/SUMMARY.md"; then
              echo "✅ Audit passed!"
              exit 0
            else
              echo "⚠️ Audit status unclear"
              exit 1
            fi
          else
            echo "❌ Summary not found!"
            exit 1
          fi
