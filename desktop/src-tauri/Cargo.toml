[package]
name = "lunt"
version = "0.1.0"
description = "Sistema inteligente de análisis y gestión de costos de construcción"
authors = ["Equipo Lunt"]
edition = "2021"

[lib]
name = "lunt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lunt"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
