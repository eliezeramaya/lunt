# Lunt API - Nginx Configuration with Security Headers
# NOTE: This configuration includes production-ready security headers
# For development, some headers may be relaxed (see CSP)

server {
    listen 80;
    server_name localhost;

    # Security Headers
    # NOTE: These headers protect against common web vulnerabilities

    # HSTS: Force HTTPS for 1 year (enable only when using HTTPS)
    # Uncomment when using SSL/TLS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent clickjacking attacks
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer policy: only send referrer to same origin
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy: disable unused browser features
    # NOTE: Adjust based on your application needs
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content Security Policy
    # NOTE: In development, this is relaxed. In production, tighten 'unsafe-inline'
    # Development CSP (allows inline scripts/styles for hot reload):
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http://localhost:* https:; font-src 'self' data:;" always;

    # Production CSP (uncomment and adjust when deploying):
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'sha256-...'; script-src 'self' 'sha256-...'; connect-src 'self' https://api.lunt.com; font-src 'self';" always;

    # Remove version information
    server_tokens off;

    # Main API proxy
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Metabase BI Tool
    location /metabase/ {
        proxy_pass http://metabase:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File upload limit
    client_max_body_size 100M;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
