[project]
name = "lunt"
version = "1.0.0"
description = "Sistema inteligente de analisis y gestion de costos de construccion"
authors = [{name = "Eliezer Amaya", email = "eliezeramaya@users.noreply.github.com"}]
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["api"]

[tool.ruff.lint.per-file-ignores]
"api/models/*.py" = ["F821"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.eggs
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["api/tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]
